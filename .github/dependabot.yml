version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-dependencies: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      api-dependencies: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      web-dependencies: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
