name: Security assurance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sast-secrets-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.11', cache: pip }
      - run: python -m pip install --disable-pip-version-check -e '.[dev]' pip-audit bandit
      - name: Lint and test
        run: ruff check . && pytest -q
      - name: Python SAST
        run: bandit -q -r agents apps/api/app intelligence policy executive security -x apps/api/migrations
      - name: Python dependency audit
        run: pip-audit
      - name: Secret patterns and production artifacts
        run: python security/ci_guard.py && ! find . -path './.git' -prune -o -type f \( -name '*.map' -o -name '.env' -o -name '*.sqlite' -o -name '*.db' \) -print | grep .
      - name: Release hash manifest
        run: python security/release_manifest.py --output SHA256SUMS && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: SHA256SUMS, path: SHA256SUMS, retention-days: 30 }
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Reject browser source maps
        run: '! find .next -type f -name "*.map" -print | grep .'
