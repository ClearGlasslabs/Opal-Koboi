name: Deploy GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "CG-os.html"
      - "artemis-blueprint.md"
      - "assets/**"
      - "docs/advanced-campaign-system.md"
      - "robots.txt"
      - "sitemap.xml"
      - "security/validate_static_site.py"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # Do not interrupt a production deployment midway through a release.
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package static site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Stage allowlisted site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          python3 security/validate_static_site.py --site-root .
          install -d _site
          install -m 0644 index.html _site/index.html
          install -m 0644 CG-os.html artemis-blueprint.md robots.txt sitemap.xml _site/
          if [ -f .nojekyll ]; then install -m 0644 .nojekyll _site/.nojekyll; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi
          install -d _site/docs
          install -m 0644 docs/advanced-campaign-system.md _site/docs/advanced-campaign-system.md
          test -s _site/index.html

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy validated static site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed critical routes
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "${DEPLOYMENT_URL%/}/" | grep -Fq "ClearGlassInc Artemis"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "${DEPLOYMENT_URL%/}/CG-os.html" | grep -Fq "CG-OS Flagship Product"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "https://www.clearglassinc.com/" | grep -Fq "ClearGlassInc Artemis"
