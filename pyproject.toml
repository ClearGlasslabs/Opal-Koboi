[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "clearglass-financial-watchdog"
version = "2.2.0"
description = "Auditable entity extraction for Canadian public-sector financial influence analysis"
readme = "docs/financial-influence-watchdog-v2.1.md"
requires-python = ">=3.10"
license = { text = "Proprietary - ClearGlass Inc." }
authors = [{ name = "ClearGlass Intelligence Team" }]
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<4"]
anthropic = ["anthropic>=0.34,<2"]
providers = [
  "openai>=1.40,<4",
  "anthropic>=0.34,<2",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "setuptools>=83",
]

[project.scripts]
clearglass-watchdog = "intelligence.financial_watchdog_agent:main"

[tool.setuptools]
packages = ["agents", "cybersecurity", "executive", "intelligence", "memory", "operations", "policy", "telemetry"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
